# Buyer profile — drives every search, score and due-diligence path.
# Lives at $PROPERTY_WORKSPACE/profile.yaml
#
# You can run several searches in parallel, in more than one country. Each keeps
# its own zone, property types, currency, area units and price-per-area baseline
# — that separation is the point. A plot in Tavira, a ruin in Alentejo and an
# acreage tract outside Austin do not belong in the same median, and pooling them
# produces a number that describes none of the three.
#
# Keep each individual search narrow (one or two types, one anchor town, 15–20 km).
# Several narrow searches work. One wide search does not.

buyer:
  name: ""
  residency: ""          # pt | eu | non-eu — decides visa/NIF path, not buying rights
  nif: false             # Portuguese tax number obtained? Mandatory before any deed
  pt_bank_account: false # Needed to pay IMT/stamp duty and utilities
  lawyer: ""             # independent lawyer, not the agent's recommendation

searches:
  # ---------------------------------------------------------------------------
  # Copy this block once per search. `name` is the key used everywhere:
  #   /property-scan algarve-plots
  #   python tracker.py stats --search algarve-plots
  # ---------------------------------------------------------------------------
  - name: ""             # short slug, e.g. "algarve-plots", "austin-land"
    country: PT          # PT | US — picks the portals, the currency, the area
                         # units and which due-diligence skill applies. Getting
                         # this wrong prices Austin acreage per square metre.
    active: true         # set false to pause a search without deleting its history
    purpose: ""          # living | renting | tourism | building | land-banking
    property_types:      # 1–2 per search. More than that and the due-diligence
      - ""               # paths diverge too far to learn any of them properly.
    timeline: ""         # e.g. "buy within 12 months", "learning the market first"

    zone:
      anchor: ""         # the town you centre on, e.g. "São Brás de Alportel"
      radius_km: 20      # the guide's 15–20 km rule — resist widening this
      # Portugal:
      concelhos: []      # explicit municipalities inside the radius (for Idealista)
      freguesias: []     # optional narrower parishes
      # United States:
      state: ""          # two-letter, e.g. TX
      cities: []         # e.g. ["Austin", "Dripping Springs"] — Zillow, Realtor
      counties: []       # e.g. ["Travis", "Hays"] — LandWatch, and the tracker's region
      zips: []           # e.g. ["78737", "78620"] — Redfin needs these, see below

    budget:
      currency: EUR      # EUR for PT, USD for US
      min: 0
      max: 0
      includes_costs: false  # true if max already covers IMT + stamp duty + works
      # Rough acquisition costs on top of price: IMT (sliding, ~0–7.5%; 5% flat on
      # rustic land), stamp duty 0.8%, notary + registration ~1,000–1,500 €,
      # lawyer ~1–1.5%. Verify current rates at purchase time — they change.

    requirements:
      # Portugal (metric):
      land_m2_min: 0
      built_m2_min: 0
      # United States (imperial):
      land_acres_min: 0    # note: Travis County requires 5+ acres for a lot on
                           # an individual Trinity-aquifer well
      built_sqft_min: 0
      bedrooms_min: 0
      must_have: []      # e.g. ["road access", "electricity within 100m", "south facing"]
      deal_breakers: []  # e.g. ["north facing", "RAN/REN", "no legal ruin registration",
                         #       "slope > 15%", "high-voltage lines"]

    alerts:              # where saved searches exist, so you know what is covered
      # Portugal:
      idealista:  {saved_search: false, email_alert: false}
      imovirtual: {saved_search: false, email_alert: false}
      casa_sapo:  {saved_search: false, email_alert: false}
      olx:        {saved_search: false, email_alert: false}
      # United States:
      zillow:     {saved_search: false, email_alert: false}
      redfin:     {saved_search: false, email_alert: false}
      realtor:    {saved_search: false, email_alert: false}
      landwatch:  {saved_search: false, email_alert: false}
      facebook:   {groups: []}

    # US only. Texas does not publish sale prices, so the tracker's medians are
    # asking-price medians until you have an MLS-side source for sold comps.
    # Record it here once you do — it is the highest-value input in a US search.
    sold_comps_source: ""   # e.g. "agent: Jane Doe, Unlock MLS" 

# Updated by the tracker — do not hand-edit.
progress: {}
