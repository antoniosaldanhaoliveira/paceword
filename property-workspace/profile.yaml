# Buyer profile — drives every search, score and due-diligence path.
# Lives at $PROPERTY_WORKSPACE/profile.yaml
#
# Several searches run in parallel, in more than one country. Each keeps its own
# zone, property types, currency, area units and price-per-area baseline — that
# separation is the point. Austin acreage and an Austin house do not belong in
# the same median, and pooling them produces a number that describes neither.
#
# Keep each search narrow. Several narrow searches work. One wide search does not.

buyer:
  name: "Antonio"
  residency: "us"        # US person — full financing menu, homestead exemption
                         # available on a primary residence, no FIRPTA on sale,
                         # Texas SB 17 does not restrict you.
  lawyer: ""             # not required in Texas (a title company closes), but
                         # worth having for land with easements or access issues
  sold_comps_source: ""  # ← the highest-value thing you can add to a US search.
                         # Texas does not publish sale prices. Until an agent is
                         # feeding you sold comps, every median below is an
                         # ASKING-price median. Record the source here.

searches:
  # ===========================================================================
  # AUSTIN — LAND
  # Hill Country and the eastern growth edge: the most buyer-favouring
  # submarkets in the metro. Financed completely differently from a house —
  # expect 20–50% down, local or Farm Credit lenders, or seller financing.
  # Land gets no homestead exemption and no 10% appraisal cap.
  # ===========================================================================
  - name: austin-land
    country: US
    active: true
    purpose: building        # building | land-banking
    property_types: [acreage]
    timeline: ""

    zone:
      anchor: "Dripping Springs"
      state: TX
      radius_km: 45
      cities: ["Dripping Springs", "Wimberley", "Bastrop"]
      counties: ["Hays", "Travis", "Bastrop"]
      # Redfin needs ZIPs — it has no derivable city id. These cover the
      # Dripping Springs / Wimberley / Bastrop corridors.
      zips: ["78620", "78737", "78676", "78602", "78612"]

    budget:
      currency: USD
      min: 150000
      max: 600000           # ← adjust. Set this from cash available rather than
      includes_costs: false #   from a mortgage: land lending is far tighter
                            #   than housing and wants 20–50% down.

    requirements:
      land_acres_min: 5    # NOT arbitrary. Travis County requires 5+ acres for a
                           # lot served by an individual well on the Trinity
                           # aquifer. Below this, many tracts are unbuildable.
      must_have:
        - "legal road access — recorded easement or public frontage"
        - "water — existing well with flow test, or written utility will-serve"
      deal_breakers:
        - "no septic/OSSF feasibility"
        - "in FEMA or Austin Atlas 14 floodplain"
        - "ETJ status unresolved"
        - "ag rollback exposure if building"
        - "no mineral rights disclosure"
        - "pipeline or transmission easement through the building envelope"

    alerts:
      zillow:     {saved_search: false, email_alert: false}
      redfin:     {saved_search: false, email_alert: false}
      realtor:    {saved_search: false, email_alert: false}
      landwatch:  {saved_search: false, email_alert: false}
      facebook:   {groups: []}

  # ===========================================================================
  # AUSTIN — HOUSES
  # Value corridors south (Kyle/Buda), city stock (78704/78745), and the
  # established north (Georgetown). If one of these becomes your primary
  # residence, it — and only it — gets the homestead exemption and the 10% cap.
  # ===========================================================================
  - name: austin-homes
    country: US
    active: true
    purpose: living
    property_types: [house]
    timeline: ""

    zone:
      anchor: "Austin"
      state: TX
      radius_km: 40
      cities: ["Austin", "Kyle", "Buda", "Georgetown"]
      counties: ["Travis", "Hays", "Williamson"]
      zips: ["78745", "78704", "78640", "78610", "78626"]
      # 78748 and 78739 deliberately excluded — Onion Creek corridor, the
      # metro's worst flood history. Add them back only with a flood quote.

    budget:
      currency: USD
      min: 300000
      max: 650000           # ← adjust. Metro median ~$445k; City of Austin
      includes_costs: false #   proper ~$595k. Above ~$800k you are into jumbo.

    requirements:
      built_sqft_min: 1400
      bedrooms_min: 3
      must_have: []
      deal_breakers:
        - "in FEMA or Austin Atlas 14 floodplain"
        - "combined tax rate over 2.5% — usually means a MUD"
        - "unpermitted square footage — TCAD disagrees with the listing"
        - "active HOA litigation or pending special assessment"
        - "foundation movement without an engineer's report"

    alerts:
      zillow:     {saved_search: false, email_alert: false}
      redfin:     {saved_search: false, email_alert: false}
      realtor:    {saved_search: false, email_alert: false}
      facebook:   {groups: []}

  # ===========================================================================
  # AUSTIN — WELLNESS HOTEL SITE  (commercial development search)
  #
  # Different portals, different diligence, different everything. A 50-key hotel
  # site never appears on Zillow, and the binding constraint is not price — it
  # is IMPERVIOUS COVER. See docs/austin-wellness-hotel-site-brief.md.
  #
  # Minimum viable acreage, derived not guessed (surface parking):
  #   Barton Springs Zone recharge  15% IC  ->  11-17 acres
  #   Barton Creek watershed        20% IC  ->   8-13 acres
  #   BSZ contributing zone         25% IC  ->   6-10 acres
  #   Water Supply / Lake Austin    40% IC  ->   4-6  acres
  #   Existing commercial, grandfathered    ->   3-4  acres
  # The last row is why an existing office building beats raw land here.
  # ===========================================================================
  - name: austin-wellness-site
    country: US
    active: true
    purpose: tourism
    property_types: [hotel, office, commercial_land]
                           # 'hotel' covers the tired-lodging category:
                           # older under-invested lodging on good land,
                           # priced on operations rather than dirt.
    timeline: ""

    zone:
      anchor: "Austin"
      state: TX
      radius_km: 40          # ~30 minutes' drive, not 30 km. The rule is time,
                             # and RM 620 and Hwy 71 differ by 15 minutes over
                             # the same distance — check the route, not the map.
      cities: ["Austin", "West Lake Hills", "Rollingwood", "Bee Cave",
               "Lakeway", "Spicewood", "Steiner Ranch"]
      counties: ["Travis"]
      zips: []

    budget:
      currency: USD
      min: 0
      max: 0               # 0 = no cap. Capital is not the binding constraint
      includes_costs: false # here; impervious cover is. Rank candidates on
                            # buildable envelope, then price the shortlist.
                            # Revisit once a capital stack is fixed — at that
                            # point this becomes a real filter again.

    requirements:
      land_acres_min: 5
      must_have:
        - "hotel use permitted by right, or a credible path to it"
        # For existing lodging: keys already standing net down the build, and an
        # operating history means entitlements and utilities are already solved.
        - "wastewater capacity — city sewer, or WCID/MUD with written capacity"
        - "impervious cover headroom for the full program (see brief)"
        - "outdoor activation possible — usable, non-floodplain, non-CWQZ land"
        # 30 minutes to downtown, verified on the actual route at the actual
        # hour. Hwy 71 runs ~15 min faster than RM 620 over the same distance.
      deal_breakers:
        - "Barton Springs Zone recharge at under 10 acres with no grandfathered cover"
        - "inside West Lake Hills or Rollingwood city limits — no hotel use"
        - "Critical Water Quality Zone across the developable area"
        - "no wastewater path"
        - "heritage trees through the building envelope"

    alerts:
      loopnet:        {saved_search: false, email_alert: false}
      crexi:          {saved_search: false, email_alert: false}
      commercialcafe: {saved_search: false, email_alert: false}

  # ===========================================================================
  # PORTUGAL — paused until you give me the zone and budget.
  # Set active: true and fill in the zone to bring it back.
  # ===========================================================================
  - name: portugal
    country: PT
    active: false
    purpose: ""
    property_types: []
    zone:
      anchor: ""
      radius_km: 20
      concelhos: []
    budget: {currency: EUR, min: 0, max: 0}
    requirements: {land_m2_min: 0}
    alerts:
      idealista:  {saved_search: false, email_alert: false}
      imovirtual: {saved_search: false, email_alert: false}
      casa_sapo:  {saved_search: false, email_alert: false}
      olx:        {saved_search: false, email_alert: false}

# Updated by the tracker — do not hand-edit.
progress: {}
